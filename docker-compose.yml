# testing phase hapus ini kalau sudah selesai testing

# aturan yang di terapkan:
# 1. named volumes untuk semua data
# 4. restart:always
# 5. logging limits
# 6 & 11. network isolation(buat prod, testing pakai docker-compose.override.yml)
# 8. healthcheck
# 9. pin versions
# 13. timezone taruh di .env biar semua pakai dan kalau mau ganti tinggal ganti di .env
# 16. multiple networks (frontend_net & backend_net)

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  chroma_data:

services:
  # postgres (database relational utama)
  postgres-db:
    image: postgres:15.4
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TZ:-Asia/Jakarta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # redis (message broker & cache)
  redis:
    image: redis:7.2.4
    restart: always
    # mengaktifkan AOF untuk persistensi sesi telegram dan antrian RQ
    command: redis-server --appendonly yes --save 60 1 --save 300 10
    environment:
      - TZ=${TZ:-Asia/Jakarta}
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # minio (object storage)
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - TZ=${TZ:-Asia/Jakarta}
    volumes:
      - minio_data:/data
    networks:
      - backend_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # chromadb (vector database)
  chromadb:
    image: chromadb/chroma:0.4.24
    restart: always
    environment:
      - TZ=${TZ:-Asia/Jakarta}
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - backend_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 10s
      timeout: 5s
      retries: 5